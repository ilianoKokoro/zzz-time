name: Tauri production build

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - prod
        paths-ignore:
            - "README.md"
            - "LICENSE"
            - ".gitignore"
            - "screenshots/**"

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: lts/*

jobs:
    build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v6

            - name: Install Node
              uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install NPM dependencies
              run: npm i

            - name: Build the Tauri app
              run: npm run tauri build

            - name: Rename files
              shell: bash
              run: |
                  mv src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/zzz-time-setup.exe
                  mv src-tauri/target/release/zzz-time.exe src-tauri/target/release/zzz-time-standalone.exe

            - name: Upload Installer
              uses: actions/upload-artifact@v7
              with:
                  path: src-tauri/target/release/bundle/nsis/zzz-time-setup.exe
                  overwrite: true
                  archive: false
                  if-no-files-found: error

            - name: Upload EXE
              uses: actions/upload-artifact@v7
              with:
                  path: src-tauri/target/release/zzz-time-standalone.exe
                  overwrite: true
                  archive: false
                  if-no-files-found: error
    publish-github-release:
        permissions:
            packages: write
            contents: write
        if: github.ref_name == 'prod'
        needs:
            - build
        runs-on: ubuntu-latest
        name: Publish the GitHub release
        steps:
            - uses: actions/checkout@v6

            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: ./artifacts
                  merge-multiple: true

            - name: Extract version
              id: get_version
              shell: bash
              run: |
                  version=$(node -p "require('./package.json').version")

                  echo "version=$version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: ncipollo/release-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag: v${{ steps.get_version.outputs.version }}
                  name: ZZZ Time v${{ steps.get_version.outputs.version }}
                  artifacts: ./artifacts/**/*.msi,./artifacts/**/*.exe
                  generateReleaseNotes: true
                  draft: true
                  allowUpdates: true
